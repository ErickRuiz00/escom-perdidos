# Presupuesto moderado para equipos con poca memoria disponible.
# Las propiedades de ~/.gradle/gradle.properties tienen prioridad sobre estas.
org.gradle.jvmargs=-Xms128m -Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false

# Evita otra JVM para Kotlin, sus reintentos y el fallback fuera de proceso.
kotlin.compiler.execution.strategy=in-process
# También se propaga al build incluido de flutter_tools (:gradle:compileKotlin).
systemProp.org.gradle.project.kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.enableJetifier=true
